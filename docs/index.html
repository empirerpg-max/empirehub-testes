<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Empire Play — Testes</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{
  font-family:'Inter',system-ui,sans-serif;
  min-height:100dvh;
  background:#0a0a0f;
  color:#e8e8f0;
  padding-bottom:160px;
  overflow-x:hidden;
}
button,input{font:inherit;color:inherit;background:none;border:none;cursor:pointer;outline:none}
img{display:block;max-width:100%;height:auto}
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}

/* ── Tokens ── */
:root{
  --primary:#a78bfa;
  --primary-dim:rgba(167,139,250,.12);
  --primary-border:rgba(167,139,250,.3);
  --bg:#0a0a0f;
  --surface:rgba(255,255,255,.03);
  --border:rgba(255,255,255,.06);
  --muted:rgba(255,255,255,.35);
  --faint:rgba(255,255,255,.15);
  --text:#e8e8f0;
  --radius-card:1.25rem;
  --radius-pill:999px;
  --transition:150ms cubic-bezier(.16,1,.3,1);
}

/* ── Header hero ── */
#hero{
  padding:24px 16px 20px;
  background:linear-gradient(180deg,rgba(88,56,200,.45) 0%,transparent 100%);
}
#hero-label{
  display:flex;align-items:center;gap:6px;
  font-size:9px;font-weight:900;text-transform:uppercase;
  letter-spacing:.2em;color:var(--muted);margin-bottom:4px;
}
#hero-label svg{color:var(--primary)}
#hero h1{font-size:24px;font-weight:900;letter-spacing:-.03em;line-height:1.1}
#hero p{font-size:11px;color:var(--muted);margin-top:4px}

/* ── Tab bar ── */
#tabbar{
  position:sticky;
  top:0;
  z-index:30;
  background:rgba(10,10,15,.9);
  backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid var(--border);
  display:flex;overflow-x:auto;
  padding:0 8px;
  scrollbar-width:none;
}
#tabbar::-webkit-scrollbar{display:none}
.tab-btn{
  display:flex;align-items:center;gap:6px;
  padding:14px 16px;
  font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:.1em;
  color:var(--muted);
  border-bottom:2px solid transparent;
  white-space:nowrap;flex-shrink:0;
  margin-bottom:-1px;
  transition:color var(--transition),border-color var(--transition);
}
.tab-btn.active{color:var(--primary);border-bottom-color:var(--primary)}
.tab-btn svg{width:13px;height:13px;flex-shrink:0}

/* ── Page content ── */
#content{padding:24px 16px 0}
.panel{display:none}
.panel.active{display:block}

/* ── Section header ── */
.sec-header{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:12px;
}
.sec-title{
  display:flex;align-items:center;gap:8px;
  font-size:11px;font-weight:900;
  text-transform:uppercase;letter-spacing:.15em;
}
.sec-title svg{width:14px;height:14px;color:var(--primary)}
.sec-more{
  font-size:9px;font-weight:900;text-transform:uppercase;
  letter-spacing:.12em;color:var(--muted);
  display:flex;align-items:center;gap:3px;
  transition:color var(--transition);
}
.sec-more:active{color:var(--primary)}

/* ── Sub-tab bar ── */
.subtabs{
  display:flex;gap:6px;
  padding:4px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-card);
  margin-bottom:20px;
  overflow-x:auto;
  scrollbar-width:none;
}
.subtabs::-webkit-scrollbar{display:none}
.subtab{
  flex:1;padding:10px 12px;
  border-radius:calc(var(--radius-card) - 4px);
  font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.12em;
  color:var(--muted);white-space:nowrap;flex-shrink:0;
  transition:background var(--transition),color var(--transition);
}
.subtab.active{background:var(--primary);color:#0a0a0f}

/* ── Song card (grid) ── */
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.song-card{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.song-card-thumb{
  position:relative;
  aspect-ratio:1/1;width:100%;
  border-radius:var(--radius-card);
  overflow:hidden;
  background:var(--primary-dim);
  transition:box-shadow var(--transition);
}
.song-card-thumb img{width:100%;height:100%;object-fit:cover}
.song-card-thumb .placeholder{
  width:100%;height:100%;
  display:grid;place-items:center;
  color:rgba(167,139,250,.3);
}
.song-card-thumb .placeholder svg{width:28px;height:28px}
.song-card.active .song-card-thumb{box-shadow:0 0 0 2px var(--primary)}
.song-card-badge-novo{
  position:absolute;top:8px;left:8px;
  padding:2px 7px;border-radius:var(--radius-pill);
  background:var(--primary);color:#0a0a0f;
  font-size:8px;font-weight:900;
  text-transform:uppercase;letter-spacing:.15em;
}
.equalizer{
  position:absolute;bottom:8px;left:8px;
  display:flex;gap:2px;align-items:flex-end;
}
.eq-bar{
  width:3px;background:var(--primary);border-radius:2px;
  animation:eq .7s ease-in-out infinite alternate;
}
.eq-bar:nth-child(2){animation-delay:.15s}
.eq-bar:nth-child(3){animation-delay:.08s}
@keyframes eq{0%{height:4px}100%{height:14px}}
.song-card-info .title{
  font-size:10px;font-weight:900;
  text-transform:uppercase;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  transition:color var(--transition);
}
.song-card.active .song-card-info .title{color:var(--primary)}
.song-card-info .artist{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.song-card-info .date{font-size:8px;color:rgba(255,255,255,.2);margin-top:1px}

/* ── Video card (grid) ── */
.video-card{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.video-card-thumb{
  position:relative;
  aspect-ratio:16/9;width:100%;
  border-radius:var(--radius-card);
  overflow:hidden;
  background:var(--primary-dim);
}
.video-card-thumb img{width:100%;height:100%;object-fit:cover}
.video-card-thumb .placeholder{width:100%;height:100%;display:grid;place-items:center;color:rgba(167,139,250,.3)}
.video-card-thumb .placeholder svg{width:24px;height:24px}
.video-card-overlay{
  position:absolute;inset:0;
  display:grid;place-items:center;
  background:rgba(0,0,0,.2);
}
.video-card-overlay .play-circle{
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.5);
  display:grid;place-items:center;
}
.video-card-overlay .play-circle svg{width:16px;height:16px;color:#fff}
.video-card.active .video-card-thumb{box-shadow:0 0 0 2px var(--primary)}
.video-card-info .title{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.video-card.active .video-card-info .title{color:var(--primary)}
.video-card-info .artist{font-size:9px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}

/* ── Row track ── */
.track-list{display:flex;flex-direction:column;gap:2px}
.track-row{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  padding:10px 12px;
  border-radius:var(--radius-card);
  border:1px solid transparent;
  transition:background var(--transition),border-color var(--transition);
}
.track-row:active{background:rgba(255,255,255,.03)}
.track-row.active{background:var(--primary-dim);border-color:var(--primary-border)}
.track-row .num{
  width:18px;flex-shrink:0;
  display:grid;place-items:center;
}
.track-row .num span{font-size:9px;font-weight:900;color:rgba(255,255,255,.2);font-variant-numeric:tabular-nums}
.track-row .thumb{
  width:40px;height:40px;border-radius:10px;
  overflow:hidden;background:var(--primary-dim);flex-shrink:0;
  display:grid;place-items:center;
}
.track-row .thumb img{width:100%;height:100%;object-fit:cover}
.track-row .thumb svg{width:16px;height:16px;color:rgba(167,139,250,.3)}
.track-row .info{min-width:0;flex:1}
.track-row .info .title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-row.active .info .title{color:var(--primary)}
.track-row .info .sub{font-size:9px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track-row .chevron svg{width:14px;height:14px;color:rgba(255,255,255,.2)}

/* ── Chart row ── */
.chart-row{
  display:flex;align-items:center;gap:10px;
  width:100%;text-align:left;
  padding:10px 12px;border-radius:var(--radius-card);
  border:1px solid transparent;
  transition:background var(--transition);
}
.chart-row:active,.chart-row.active{background:var(--primary-dim)}
.chart-row.active{border-color:var(--primary-border)}
.chart-pos{
  width:18px;flex-shrink:0;text-align:center;
  font-size:10px;font-weight:900;color:rgba(255,255,255,.2);
  font-variant-numeric:tabular-nums;
}
.chart-row.active .chart-pos,.chart-pos.top{color:var(--primary)}
.chart-thumb{
  width:36px;height:36px;border-radius:8px;
  overflow:hidden;background:rgba(255,255,255,.05);flex-shrink:0;
  display:grid;place-items:center;
}
.chart-thumb img{width:100%;height:100%;object-fit:cover}
.chart-thumb svg{width:14px;height:14px;color:rgba(255,255,255,.1)}
.chart-info{min-width:0;flex:1}
.chart-info .title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-row.active .chart-info .title{color:var(--primary)}

/* ── Chart mini card ── */
.chart-mini{
  width:100%;text-align:left;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:calc(var(--radius-card)*1.2);
  overflow:hidden;
  transition:border-color var(--transition);
}
.chart-mini:active{border-color:var(--primary-border)}
.chart-mini-thumb{position:relative;aspect-ratio:1/1;background:rgba(255,255,255,.05)}
.chart-mini-thumb img{width:100%;height:100%;object-fit:cover}
.chart-mini-thumb .icon-fallback{width:100%;height:100%;display:grid;place-items:center;font-size:36px}
.chart-mini-grad{
  position:absolute;inset:0;
  background:linear-gradient(to top,rgba(0,0,0,.85) 0%,transparent 60%);
}
.chart-mini-label{
  position:absolute;bottom:10px;left:10px;right:10px;
  font-size:9px;font-weight:900;color:#fff;
  text-transform:uppercase;letter-spacing:.06em;
  line-height:1.3;
}

/* ── Chart detail ── */
.chart-detail-header{
  display:flex;align-items:center;gap:12px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:calc(var(--radius-card)*1.2);
  margin-bottom:16px;
}
.chart-detail-thumb{
  width:56px;height:56px;border-radius:12px;
  overflow:hidden;background:rgba(255,255,255,.05);flex-shrink:0;
  display:grid;place-items:center;font-size:24px;
}
.chart-detail-thumb img{width:100%;height:100%;object-fit:cover}
.chart-detail-meta .label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.15em;color:var(--muted)}
.chart-detail-meta .name{font-size:15px;font-weight:900;letter-spacing:-.02em;margin-top:2px}
.chart-detail-meta .count{font-size:9px;color:var(--muted);margin-top:2px}

/* ── Back btn ── */
.back-btn{
  display:flex;align-items:center;gap:6px;
  font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.15em;
  color:var(--muted);
  margin-bottom:16px;
  transition:color var(--transition);
}
.back-btn:active{color:var(--primary)}
.back-btn svg{width:14px;height:14px}

/* ── Forum card ── */
.forum-card{
  display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;
  padding:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:calc(var(--radius-card)*1.2);
  transition:border-color var(--transition);
}
.forum-card:active{border-color:var(--primary-border)}
.forum-card-thumb{
  width:40px;height:40px;border-radius:10px;
  overflow:hidden;background:var(--primary-dim);flex-shrink:0;
  display:grid;place-items:center;
}
.forum-card-thumb img{width:100%;height:100%;object-fit:cover}
.forum-card-thumb svg{width:14px;height:14px;color:rgba(167,139,250,.4)}
.forum-card-title{font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.forum-card .msg-icon svg{width:14px;height:14px;color:rgba(255,255,255,.2)}

/* ── Forum detail ── */
.forum-detail-hero{
  display:flex;align-items:flex-start;gap:12px;
  padding:16px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:calc(var(--radius-card)*1.2);
  margin-bottom:16px;
}
.forum-detail-hero-thumb{
  width:52px;height:52px;border-radius:12px;
  overflow:hidden;background:var(--primary-dim);flex-shrink:0;
  display:grid;place-items:center;
}
.forum-detail-hero-thumb img{width:100%;height:100%;object-fit:cover}
.forum-detail-hero-thumb svg{width:18px;height:18px;color:rgba(167,139,250,.4)}
.forum-detail-title{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}
.play-inline-btn{
  display:inline-flex;align-items:center;gap:6px;
  margin-top:8px;
  padding:6px 12px;border-radius:var(--radius-pill);
  background:var(--primary);color:#0a0a0f;
  font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.12em;
}
.play-inline-btn svg{width:10px;height:10px}
.letra-details{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);padding:16px;
  margin-bottom:16px;
}
.letra-details summary{
  font-size:9px;font-weight:900;
  text-transform:uppercase;letter-spacing:.15em;
  color:var(--primary);cursor:pointer;
}
.letra-pre{
  margin-top:12px;
  white-space:pre-wrap;font-size:11px;
  font-family:inherit;color:rgba(255,255,255,.7);
  line-height:1.7;
}
.comment-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius-card);
  padding:12px 16px;
}
.comment-author{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.12em;color:var(--primary);margin-bottom:4px}
.comment-text{font-size:11px;color:rgba(255,255,255,.75);line-height:1.5}
.comment-form{display:flex;gap:8px;padding-top:8px}
.comment-input{
  height:40px;background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius-pill);
  padding:0 14px;font-size:11px;font-weight:700;
  transition:border-color var(--transition);
}
.comment-input:focus{border-color:var(--primary-border)}
.comment-send{
  width:40px;height:40px;border-radius:50%;
  background:var(--primary);color:#0a0a0f;
  display:grid;place-items:center;flex-shrink:0;
}
.comment-send:disabled{opacity:.3}
.comment-send svg{width:15px;height:15px}

/* ── MiniPlayer ── */
#miniplayer{
  position:fixed;bottom:56px;left:0;right:0;z-index:30;
  padding:0 12px 8px;
  display:none;
}
#miniplayer.visible{display:block}
#mp-inner{
  max-width:640px;margin:0 auto;
  background:rgba(16,14,26,.97);
  backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(167,139,250,.15);
  border-radius:20px;
  padding:12px 14px;
}
#mp-track{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#mp-thumb{
  width:38px;height:38px;border-radius:10px;
  background:var(--primary-dim);flex-shrink:0;
  overflow:hidden;display:grid;place-items:center;
}
#mp-thumb img{width:100%;height:100%;object-fit:cover}
#mp-thumb svg{width:16px;height:16px;color:rgba(167,139,250,.4)}
#mp-info{min-width:0;flex:1}
#mp-title{font-size:12px;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mp-artist{font-size:10px;color:var(--muted);margin-top:1px}
#mp-controls{display:flex;align-items:center;gap:8px}
#mp-prev,#mp-next{font-size:18px;color:var(--faint);padding:2px;transition:color var(--transition)}
#mp-prev:active,#mp-next:active{color:var(--primary)}
#mp-play-btn{
  width:32px;height:32px;border-radius:50%;
  background:var(--primary);color:#0a0a0f;
  display:grid;place-items:center;flex-shrink:0;
}
#mp-play-btn svg{width:13px;height:13px}
#mp-progress{flex:1;height:3px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
#mp-bar{height:100%;background:var(--primary);width:0%;transition:width .4s linear}
#mp-close{font-size:16px;color:rgba(255,255,255,.2);padding:4px;transition:color var(--transition)}
#mp-close:active{color:var(--primary)}

/* ── YouTube pip ── */
#yt-pip{
  position:fixed;bottom:180px;right:12px;z-index:25;
  width:192px;aspect-ratio:16/9;
  border-radius:14px;overflow:hidden;
  border:1px solid rgba(255,255,255,.1);
  display:none;box-shadow:0 8px 32px rgba(0,0,0,.7);
}
#yt-pip.visible{display:block}
#yt-frame{width:100%;height:100%;border:none}

/* ── BottomNav ── */
#bottomnav{
  position:fixed;bottom:0;left:0;right:0;z-index:40;
  background:rgba(10,10,15,.96);
  backdrop-filter:blur(16px);
  border-top:1px solid var(--border);
  display:flex;
  padding:8px 0 max(8px,env(safe-area-inset-bottom));
}
.nav-btn{
  flex:1;display:flex;flex-direction:column;
  align-items:center;gap:3px;
  padding:4px 0;
  font-size:8px;font-weight:900;
  text-transform:uppercase;letter-spacing:.1em;
  color:rgba(255,255,255,.25);
  transition:color var(--transition);
}
.nav-btn.active{color:var(--primary)}
.nav-btn svg{width:20px;height:20px}

/* ── Skeleton ── */
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
.skeleton{
  background:linear-gradient(90deg,rgba(255,255,255,.04) 25%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.04) 75%);
  background-size:200% 100%;
  animation:shimmer 1.4s ease-in-out infinite;
  border-radius:8px;
}

/* ── Toast ── */
#toast{
  position:fixed;top:16px;left:50%;transform:translateX(-50%);
  background:rgba(22,20,34,.97);
  border:1px solid rgba(167,139,250,.2);
  color:var(--text);font-size:10px;font-weight:700;
  padding:8px 18px;border-radius:var(--radius-pill);
  z-index:999;white-space:nowrap;
  opacity:0;transition:opacity .2s;pointer-events:none;
}
#toast.show{opacity:1}

/* ── Empty state ── */
.empty{
  display:flex;flex-direction:column;
  align-items:center;text-align:center;
  padding:64px 16px;
  color:var(--muted);
}
.empty svg{width:36px;height:36px;margin-bottom:12px;opacity:.3}
.empty p{font-size:11px;opacity:.5}

/* ── Spacing ── */
.space-y>*+*{margin-top:var(--gap,8px)}
.mb-4{margin-bottom:16px}
.mb-6{margin-bottom:24px}
.mb-3{margin-bottom:12px}
.mt-4{margin-top:16px}
</style>
</head>
<body>

<!-- Hero -->
<div id="hero">
  <div id="hero-label">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></svg>
    Empire Play
  </div>
  <h1>Ouça agora</h1>
  <p>Músicas, clipes e vídeos do universo Empire</p>
</div>

<!-- Tab bar -->

// ── Helpers ────────────────────────────────────────────────────────────────
function norm(s){
  return String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]/g,"");
}
function getField(item,...aliases){
  if(!item) return "";
  const keys = Object.keys(item);
  const normKeys = keys.map(k=>({orig:k,n:norm(k)}));
  for(const alias of aliases){
    const target = norm(alias);
    const found = normKeys.find(k=>k.n===target);
    if(found && item[found.orig]!=null && item[found.orig]!=="") return item[found.orig];
  }
  return "";
}
function extractDriveId(str){
  if(!str) return null;
  const m = String(str).match(/\/d\/([a-zA-Z0-9_-]+)/) || String(str).match(/id=([a-zA-Z0-9_-]+)/);
  if(m) return m[1];
  if(!/^https?:\/\//.test(str) && !str.includes("/") && str.length>10) return str.trim();
  return null;
}
function driveThumb(capa,size=300){
  if(!capa) return "";
  const id = extractDriveId(capa)||(capa.match(/^[a-zA-Z0-9_-]{20,}$/)?capa:null);
  if(id) return `https://lh3.googleusercontent.com/d/${id}=w${size}`;
  return capa;
}
function parseTS(item){
  const raw = getField(item,"Data de lançamento","Data de lancamento","data_de_lancamento","datadelancamento","data_lancamento","datalancamento","data","release_date","releasedate");
  if(!raw||raw.trim()==="") return 0;
  const s=raw.trim();
  const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(br){const t=new Date(`${br[3]}-${br[2].padStart(2,"0")}-${br[1].padStart(2,"0")}`).getTime();return isNaN(t)?0:t;}
  if(/^\d+$/.test(s)){const n=parseInt(s,10);return n<1e12?n*1000:n;}
  const t=new Date(s).getTime();return isNaN(t)?0:t;
}
function fmtDate(ts){
  if(!ts) return "";
  const d=new Date(ts);
  if(isNaN(d.getTime())) return "";
  return `${String(d.getUTCDate()).padStart(2,"0")}/${String(d.getUTCMonth()+1).padStart(2,"0")}/${d.getUTCFullYear()}`;
}
function fmtRaw(raw){
  if(!raw||raw.trim()==="") return "";
  const s=raw.trim();
  if(/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) return s;
  if(/^\d+$/.test(s)){const n=parseInt(s,10);return fmtDate(n<1e12?n*1000:n);}
  const t=new Date(s).getTime();return isNaN(t)?s:fmtDate(t);
}
function isNovo(raw){
  if(!raw||raw.trim()==="") return false;
  const s=raw.trim();let ts=0;
  const br=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(br) ts=new Date(`${br[3]}-${br[2].padStart(2,"0")}-${br[1].padStart(2,"0")}`).getTime();
  else if(/^\d+$/.test(s)){const n=parseInt(s,10);ts=n<1e12?n*1000:n;}
  else ts=new Date(s).getTime();
  if(!ts||isNaN(ts)) return false;
  return (Date.now()-ts)/(1000*60*60*24)<=30;
}
function toPlayItem(m,cat){
  const idTopico=getField(m,"id_do_topico","idtopico","id_topico","id","ID do tópico","ID do topico");
  let titulo="";
  if(cat==="musica") titulo=getField(m,"nome_da_musica","nomedamusica","nome_musica","nome","titulo","title","Nome da música","Nome da musica","Nome da Música","track","song");
  else titulo=getField(m,"tipo_de_clipe","tipodeclipe","tipo","titulo","title","nome_do_clipe","nomedoclipe","Tipo de Clipe","Nome do Clipe","Nome do Vídeo","nomedovideo","clipe","video");
  const artista=getField(m,"act_principal","actprincipal","artista","artist","ACT Principal","Act Principal","Artista","ID do Criador","ID do criador","iddocriador","autor","author");
  const capa=getField(m,"capa_da_musica","capadamusica","capa","cover","thumb","thumbnail","Capa da música","Capa da musica","Capa da Música","Thumb");
  const audioSrc=getField(m,"id_do_arquivo","idarquivo","id_arquivo","arquivo","ID do arquivo","ID do Arquivo","Link do áudio","Link do audio","link","url","URL","ID do vídeo","ID do video","idvideo","id_video","youtube_id","youtubeid","audio","Audio");
  const letra=getField(m,"letra","lyrics","Letra");
  return {id:idTopico||audioSrc||`item-${titulo}`,titulo,artista,capa,audioSrc,letra,categoria:cat};
}
function parseCSV(csv){
  const rows=[];
  for(const line of csv.split(/\r?\n/)){
    if(!line.trim()) continue;
    const cols=[];let cur="";let inQ=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(ch===","&&!inQ){cols.push(cur);cur="";}
      else cur+=ch;
    }
    cols.push(cur);rows.push(cols);
  }
  return rows;
}
function csvToObjects(csv){
  const rows=parseCSV(csv);
  if(rows.length<2) return[];
  const headers=rows[0].map(h=>String(h).trim());
  return rows.slice(1).map(row=>{
    const obj={};
    headers.forEach((h,i)=>{obj[h]=String(row[i]??"").trim();});
    return obj;
  });
}
async function fetchCSV(aba){
  try{
    const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(aba)}`;
    const r=await fetch(url);
    if(!r.ok) return[];
    const csv=await r.text();
    const rows=parseCSV(csv);
    if(rows.length<2) return[];
    const headers=rows[0].map(h=>String(h).trim());
    return rows.slice(1).map(row=>{const o={};headers.forEach((h,i)=>{o[h]=String(row[i]??"").trim();});return o;});
  }catch(e){return[];}
}
function processChart(rows,isVideo,max=100){
  if(!rows||rows.length<1) return{entries:[],capa:""};
  const entries=rows.map(row=>{
    const posStr=getField(row,"Posição","Posicao","Pos","position","rank");
    const posicao=parseInt(posStr.replace(/\D/g,""))||0;
    const titulo=isVideo?getField(row,"Nome do vídeo","Nome do video","nomedovideo","titulo","title"):getField(row,"Nome da música","Nome da musica","nomedamusica","titulo","title","nome");
    const capa=isVideo?getField(row,"Thumb","thumb","thumbnail","capa","Capa da música"):getField(row,"Capa da música","Capa da musica","capadamusica","capa","cover");
    const idTopico=getField(row,"ID do tópico","ID do topico","idtopico","id");
    const linkAudio=getField(row,"Link do áudio","Link do audio","linkdoaudio","link","audio","url");
    const criador=getField(row,"ID do criador","iddocriador","criador","artista","artist");
    if(!posicao||!titulo) return null;
    return{posicao,titulo,capa,playItem:{id:idTopico||`chart-${posicao}`,titulo,artista:criador,capa,audioSrc:linkAudio,letra:"",categoria:isVideo?"musicvideo":"musica"}};
  }).filter(e=>e&&e.posicao>0).sort((a,b)=>a.posicao-b.posicao).slice(0,max);
  return{entries,capa:entries[0]?.capa||""};
}

function toast(msg){

  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove("show"),2800);
}

// ── Skeleton helpers ───────────────────────────────────────────────────────
function skelGrid(cols,rows){
  let h="";
  for(let r=0;r<rows;r++){
    h+=`<div style="display:grid;grid-template-columns:repeat(${cols},1fr);gap:12px;margin-bottom:12px">`;
    for(let c=0;c<cols;c++) h+=`<div><div class="skeleton" style="aspect-ratio:1/1;border-radius:20px;margin-bottom:8px"></div><div class="skeleton" style="height:10px;width:70%;border-radius:6px;margin-bottom:5px"></div><div class="skeleton" style="height:8px;width:45%;border-radius:5px"></div></div>`;
    h+="</div>";
  }
  return h;
}
function skelList(rows){
  let h="";
  for(let i=0;i<rows;i++) h+=`<div style="display:flex;align-items:center;gap:10px;padding:10px 12px"><div class="skeleton" style="width:40px;height:40px;border-radius:10px;flex-shrink:0"></div><div style="flex:1"><div class="skeleton" style="height:10px;width:60%;border-radius:5px;margin-bottom:6px"></div><div class="skeleton" style="height:8px;width:35%;border-radius:4px"></div></div></div>`;
  return h;
}

// ── Player ─────────────────────────────────────────────────────────────────
function detectType(src){
  if(!src) return"drive";
  if(src.startsWith("tg:")||src.startsWith("tg_file:")) return"telegram";
  if(src.includes("youtube")||src.includes("youtu.be")||/^[a-zA-Z0-9_-]{11}$/.test(src)) return"youtube";
  return"drive";
}
function playItem(item,q){
  queue=q||[item];
  currentIdx=queue.findIndex(x=>x.id===item.id);
  if(currentIdx<0) currentIdx=0;
  playing=true;
  updatePlayer();
  refreshActiveCards();
}
function updatePlayer(){
  if(currentIdx===null||!queue[currentIdx]) return;
  const item=queue[currentIdx];
  const type=detectType(item.audioSrc);
  document.getElementById("mp-title").textContent=item.titulo;
  document.getElementById("mp-artist").textContent=item.artista;
  const mpThumb=document.getElementById("mp-thumb");
  mpThumb.innerHTML=item.capa?`<img src="${driveThumb(item.capa,120)}" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.style.display='none'">`:iconMusic(16);
  document.getElementById("miniplayer").classList.add("visible");
  const yt=document.getElementById("yt-pip");
  const ytf=document.getElementById("yt-frame");
  if(type==="youtube"){
    const ytId=item.audioSrc.length===11?item.audioSrc:(item.audioSrc.match(/[?&]v=([a-zA-Z0-9_-]{11})/)||[])[1]||item.audioSrc;
    ytf.src=playing?`https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1`:`https://www.youtube.com/embed/${ytId}`;
    yt.classList.add("visible");
  }else{
    ytf.src="";yt.classList.remove("visible");
    if(type==="telegram") toast("🔗 Telegram: endpoint /play/ seria chamado aqui");
  }
  updatePlayIcon();
  startProgress();
}
function updatePlayIcon(){
  const icon=document.getElementById("mp-play-icon");
  icon.innerHTML=playing?'<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>':'<polygon points="5,3 19,12 5,21"/>';
}
function playerToggle(){
  if(currentIdx===null) return;
  playing=!playing;
  updatePlayIcon();
  if(playing){
    const item=queue[currentIdx];
    if(detectType(item.audioSrc)==="youtube"){
      const ytId=item.audioSrc.length===11?item.audioSrc:item.audioSrc;
      document.getElementById("yt-frame").src=`https://www.youtube.com/embed/${ytId}?autoplay=1&enablejsapi=1`;
      document.getElementById("yt-pip").classList.add("visible");
    }
    startProgress();
  }else stopProgress();
}
function playerNext(){if(currentIdx===null)return;if(currentIdx+1<queue.length){currentIdx++;updatePlayer();refreshActiveCards();}}
function playerPrev(){if(currentIdx===null)return;if(currentIdx-1>=0){currentIdx--;updatePlayer();refreshActiveCards();}}
function playerClose(){
  currentIdx=null;playing=false;queue=[];
  document.getElementById("miniplayer").classList.remove("visible");
  document.getElementById("yt-pip").classList.remove("visible");
  document.getElementById("yt-frame").src="";
  stopProgress();progressVal=0;
  document.getElementById("mp-bar").style.width="0%";
  refreshActiveCards();
}
function startProgress(){
  stopProgress();if(!playing)return;
  progressTimer=setInterval(()=>{
    progressVal=Math.min(progressVal+0.5,100);
    document.getElementById("mp-bar").style.width=progressVal+"%";
    if(progressVal>=100){progressVal=0;playerNext();}
  },150);
}
function stopProgress(){clearInterval(progressTimer);}
function refreshActiveCards(){
  document.querySelectorAll("[data-id]").forEach(el=>{
    const act=isActive(el.dataset.id);
    el.classList.toggle("active",act);
  });
}

// ── Tab switching ──────────────────────────────────────────────────────────
function setTab(tab,btn){
  activeTab=tab;
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active"));
  document.querySelectorAll(".panel").forEach(p=>p.classList.remove("active"));
  document.getElementById("panel-"+tab).classList.add("active");
  if(btn) btn.classList.add("active");
  else{const b=document.querySelector(`[data-tab="${tab}"]`);if(b)b.classList.add("active");}
  setNavActive("nav-play");
  renderTab(tab);
  window.scrollTo({top:0,behavior:"smooth"});
}
function setNavActive(id){
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.remove("active"));
  document.getElementById(id)?.classList.add("active");
}

// ── Render tabs ────────────────────────────────────────────────────────────
function renderTab(tab){
  if(tab==="home") renderHome();
  else if(tab==="musicas") renderMusicas();
  else if(tab==="clipes") renderClipes();
  else if(tab==="videos") renderVideos();
  else if(tab==="forum") renderForum();
}

// ── HOME ───────────────────────────────────────────────────────────────────
function renderHome(){
  const el=document.getElementById("home-inner");
  if(openChart){el.innerHTML=renderChartDetail(openChart);return;}

  const subtabsHTML=`<div class="subtabs mb-6">
    <button class="subtab${homeSection==="charts"?" active":""}" onclick="homeSection='charts';renderHome()">🏆 Top Charts</button>
    <button class="subtab${homeSection==="lancamentos"?" active":""}" onclick="homeSection='lancamentos';renderHome()">✨ Lançamentos</button>
  </div>`;

  let body="";
  if(homeSection==="charts"){
    body+=secHeader("<span>🏆</span>","Top Charts","");
    if(chartsLoading) body+=skelGrid(3,1);
    else if(CHARTS.length===0) body+=`<p style="font-size:10px;color:var(--muted);text-align:center;padding:32px 0;opacity:.4">Nenhum chart disponível.</p>`;
    else{
      body+=`<div class="grid-3">`;
      CHARTS.forEach(c=>{body+=chartMiniCardHTML(c);});
      body+=`</div>`;
    }
  }else{
    if(loading){body+=skelList(5)+skelList(5);}
    else{
      const lancMusicas=[...DB.musicas].sort((a,b)=>parseTS(b)-parseTS(a)).slice(0,5).map(m=>({item:toPlayItem(m,"musica"),rawDate:getField(m,"Data de lançamento","Data de lancamento","data_de_lancamento","datadelancamento","data_lancamento","datalancamento","data","release_date","releasedate")}));
      const lancVideos=[...MV_CSV].sort((a,b)=>parseTS(b)-parseTS(a)).slice(0,4).map(m=>toPlayItem(m,"musicvideo"));
      if(lancMusicas.length){
        const qMusicas=lancMusicas.map(x=>x.item);
        body+=secHeader(`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,"Últimas Músicas","musicas");
        body+=`<div class="track-list mb-6">`;
        lancMusicas.forEach(({item,rawDate},i)=>{body+=trackRowHTML(item,qMusicas,i+1,rawDate);});
        body+=`</div>`;
      }
      if(lancVideos.length){
        body+=secHeader(`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>`,"Últimos Clipes","clipes");
        body+=`<div class="grid-2">`;
        lancVideos.forEach(item=>{body+=videoCardHTML(item,lancVideos);});
        body+=`</div>`;
      }
    }
  }
  el.innerHTML=subtabsHTML+body;
}
function chartMiniCardHTML(chart){
  return`<button class="chart-mini" onclick="openChart=charts_data['${chart.nome}'];renderHome()">
    <div class="chart-mini-thumb">
      ${chart.capa?`<img src="${driveThumb(chart.capa,300)}" alt="${chart.nome}" loading="lazy" onerror="this.style.display='none'">`:
        `<div class="icon-fallback">${chart.icone}</div>`}
      <div class="chart-mini-grad"></div>
      <div class="chart-mini-label">${chart.sub}</div>
    </div>
  </button>`;
}
let charts_data={};

function renderChartDetail(chart){
  const queue=chart.entries.filter(e=>e.playItem?.audioSrc).map(e=>e.playItem);
  let h=`<button class="back-btn" onclick="openChart=null;renderHome()">${iconChevL()}Charts</button>`;
  h+=`<div class="chart-detail-header">
    <div class="chart-detail-thumb">${chart.capa?`<img src="${driveThumb(chart.capa,120)}" alt="" loading="lazy" onerror="this.style.display='none'">`:chart.icone}</div>
    <div class="chart-detail-meta">
      <div class="label">${chart.icone} ${chart.nome}</div>
      <div class="name">${chart.sub}</div>
      <div class="count">${chart.entries.length} faixas</div>
    </div>
  </div>`;
  h+=`<div>`;
  chart.entries.forEach(e=>{h+=chartRowHTML(e,queue);});
  h+=`</div>`;
  return h;
}

// ── MÚSICAS ────────────────────────────────────────────────────────────────
function renderMusicas(){
  const el=document.getElementById("musicas-inner");
  const subtabsHTML=`<div class="subtabs mb-6">
    <button class="subtab${musicasSubTab==="lancamentos"?" active":""}" onclick="musicasSubTab='lancamentos';renderMusicas()">Últimos lançamentos</button>
    <button class="subtab${musicasSubTab==="albuns"?" active":""}" onclick="musicasSubTab='albuns';renderMusicas()">Álbuns</button>
    <button class="subtab${musicasSubTab==="lancar"?" active":""}" onclick="musicasSubTab='lancar';renderMusicas()">Lançar</button>
  </div>`;
  if(loading&&DB.musicas.length===0){el.innerHTML=subtabsHTML+skelGrid(3,4);return;}
  let body="";
  if(musicasSubTab==="lancamentos"){
    const lanc=[...DB.musicas].sort((a,b)=>parseTS(b)-parseTS(a)).slice(0,30).map(m=>({item:toPlayItem(m,"musica"),rawDate:getField(m,"Data de lançamento","Data de lancamento","data_de_lancamento","datadelancamento","data_lancamento","datalancamento","data","release_date","releasedate")}));
    const q=lanc.map(x=>x.item);
    if(lanc.length===0) body=`<div class="empty">${iconMusic()}<p>Nenhuma música ainda.</p></div>`;
    else{
      body+=`<p style="font-size:9px;color:rgba(255,255,255,.2);text-transform:uppercase;letter-spacing:.12em;font-weight:900;padding:0 4px;margin-bottom:12px">${lanc.length} músicas · mais recente primeiro</p>`;
      body+=`<div class="grid-3">`;
      lanc.forEach(({item,rawDate})=>{body+=songCardHTML(item,q,rawDate);});
      body+=`</div>`;
    }
  }else if(musicasSubTab==="albuns"){
    const map={};
    DB.musicas.forEach(m=>{
      const album=getField(m,"album");if(!album)return;
      if(!map[album]) map[album]={title:album,artist:getField(m,"act_principal","actprincipal"),capa:getField(m,"capa_da_musica","capadamusica","capa","cover"),faixas:[]};
      map[album].faixas.push(toPlayItem(m,"musica"));
    });
    const albuns=Object.values(map);
    if(albuns.length===0) body=`<div class="empty">${iconMusic()}<p>Nenhum álbum ainda.</p></div>`;
    else{
      body+=`<div class="grid-2">`;
      albuns.forEach(a=>{
        body+=`<div class="song-card"><div class="song-card-thumb">${a.capa?`<img src="${driveThumb(a.capa,300)}" alt="${a.title}" loading="lazy">`:
          `<div class="placeholder">${iconMusic()}</div>`}</div><div class="song-card-info"><div class="title">${a.title}</div><div class="artist">${a.artist}</div></div></div>`;
      });
      body+=`</div>`;
    }
  }else{
    body=`<div class="empty"><svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:.3;margin-bottom:12px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg><p style="font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.1em;opacity:.5;margin-bottom:4px">Lançar música</p><p style="font-size:10px;opacity:.3">Em breve você poderá submeter suas músicas aqui.</p></div>`;
  }
  el.innerHTML=subtabsHTML+body;
}

// ── CLIPES ─────────────────────────────────────────────────────────────────
function renderClipes(){
  const el=document.getElementById("clipes-inner");
  const subtabsHTML=`<div class="subtabs mb-6">
    <button class="subtab${clipesSubTab==="novos"?" active":""}" onclick="clipesSubTab='novos';renderClipes()">Lançamentos</button>
    <button class="subtab${clipesSubTab==="top"?" active":""}" onclick="clipesSubTab='top';renderClipes()">Top Clipes</button>
  </div>`;
  if(loading){el.innerHTML=subtabsHTML+skelGrid(2,3);return;}
  const list=clipesSubTab==="novos"
    ?[...DB.musicvideos].sort((a,b)=>parseTS(b)-parseTS(a)).map(m=>toPlayItem(m,"musicvideo"))
    :[...DB.musicvideos].sort((a,b)=>(parseInt(getField(b,"weeks_video","weeksvideo"))||0)-(parseInt(getField(a,"weeks_video","weeksvideo"))||0)).map(m=>toPlayItem(m,"musicvideo"));
  let body=list.length===0?`<div class="empty">${iconVideo()}<p>Nenhum clipe ainda.</p></div>`:`<div class="grid-2">`;
  if(list.length>0){list.forEach(item=>{body+=videoCardHTML(item,list);});body+=`</div>`;}
  el.innerHTML=subtabsHTML+body;
}

// ── VÍDEOS ─────────────────────────────────────────────────────────────────
function renderVideos(){
  const el=document.getElementById("videos-inner");
  if(loading){el.innerHTML=skelGrid(2,3);return;}
  const list=[...DB.videos].sort((a,b)=>parseTS(b)-parseTS(a)).map(m=>toPlayItem(m,"video"));
  if(list.length===0){el.innerHTML=`<div class="empty">${iconVideo()}<p>Nenhum vídeo ainda.</p></div>`;return;}
  let body=`<div class="grid-2">`;
  list.forEach(item=>{body+=videoCardHTML(item,list);});
  body+=`</div>`;
  el.innerHTML=body;
}

// ── FÓRUM ──────────────────────────────────────────────────────────────────
function renderForum(){
  const el=document.getElementById("forum-inner");
  if(forumDetalhe){renderForumDetalhe(forumDetalhe.item,forumDetalhe.cat);return;}
  const subtabsHTML=`<div class="subtabs mb-4">
    <button class="subtab${forumCat==="musicas"?" active":""}" onclick="forumCat='musicas';forumDetalhe=null;renderForum()">Músicas</button>
    <button class="subtab${forumCat==="musicvideos"?" active":""}" onclick="forumCat='musicvideos';forumDetalhe=null;renderForum()">Clipes</button>
    <button class="subtab${forumCat==="videos"?" active":""}" onclick="forumCat='videos';forumDetalhe=null;renderForum()">Vídeos</button>
  </div>`;
  if(loading){el.innerHTML=subtabsHTML+skelList(5);return;}
  const db=forumCat==="musicas"?DB.musicas:forumCat==="musicvideos"?DB.musicvideos:DB.videos;
  const cat=forumCat==="musicas"?"musica":forumCat==="musicvideos"?"musicvideo":"video";
  const list=db.map(m=>toPlayItem(m,cat));
  let body=list.length===0?`<div class="empty" style="padding:40px 0">${iconMsg(32)}<p>Nenhum tópico.</p></div>`:"";
  list.forEach(item=>{
    body+=`<button class="forum-card mb-3" onclick='openForumDetalhe(${JSON.stringify(item)})'>
      <div class="forum-card-thumb">${item.capa?`<img src="${driveThumb(item.capa,80)}" alt="" loading="lazy" onerror="this.style.display='none'">`:iconMusic(14)}</div>
      <div class="forum-card-title">${item.titulo||"—"}</div>
      <div class="msg-icon">${iconMsg()}</div>
    </button>`;
  });
  el.innerHTML=subtabsHTML+body;
}
function openForumDetalhe(item){
  forumDetalhe={item,cat:forumCat};
  renderForum();
}
function renderForumDetalhe(item,cat){
  const el=document.getElementById("forum-inner");
  el.innerHTML=`<button class="back-btn" onclick="forumDetalhe=null;renderForum()">${iconChevL()}Tópicos</button>
  <div class="forum-detail-hero">
    <div class="forum-detail-hero-thumb">${item.capa?`<img src="${driveThumb(item.capa,80)}" alt="" loading="lazy" onerror="this.style.display='none'">`:iconMusic(18)}</div>
    <div style="min-width:0;flex:1">
      <div class="forum-detail-title">${item.titulo}</div>
      <button class="play-inline-btn" onclick='playItem(${JSON.stringify(item)},[${JSON.stringify(item)}])'>${iconPlay(10)} Tocar</button>
    </div>
  </div>
  ${item.letra?`<details class="letra-details"><summary>Ver Letra</summary><pre class="letra-pre">${item.letra}</pre></details>`:""}
  <div id="forum-comments">${skelList(3)}</div>
  <div class="comment-form mt-4">
    <input id="cf-nome" class="comment-input" style="flex:0.45" placeholder="Seu nome" maxlength="40"/>
    <input id="cf-texto" class="comment-input" style="flex:1" placeholder="Comentar..." maxlength="300" onkeydown="if(event.key==='Enter')enviarComentario('${item.id}','${cat}')"/>
    <button class="comment-send" id="cf-send" onclick="enviarComentario('${item.id}','${cat}')">${iconSend()}</button>
  </div>`;
  loadComentarios(item.id,cat);
}
function loadComentarios(idTopico,cat){
  fetch(`${API_URL}?action=comentarios&categoria=${cat}&idTopico=${encodeURIComponent(idTopico)}`)
    .then(r=>r.json()).then(j=>{
      const comentarios=(j.data||[]).map(c=>({nome:getField(c,"nome_do_jogador","nome")||"Anônimo",texto:getField(c,"comentario","texto")}));
      const el=document.getElementById("forum-comments");
      if(!el) return;
      if(comentarios.length===0){el.innerHTML=`<p style="font-size:10px;color:var(--muted);text-align:center;padding:24px 0;opacity:.4">Seja o primeiro a comentar.</p>`;return;}
      el.innerHTML=comentarios.map(c=>`<div class="comment-card mb-3"><div class="comment-author">${c.nome}</div><div class="comment-text">${c.texto}</div></div>`).join("");
    }).catch(()=>{
      const el=document.getElementById("forum-comments");
      if(el) el.innerHTML=`<p style="font-size:10px;color:var(--muted);text-align:center;padding:24px 0;opacity:.4">Erro ao carregar comentários.</p>`;
    });
}
async function enviarComentario(idTopico,cat){
  const nome=document.getElementById("cf-nome")?.value||"";
  const texto=document.getElementById("cf-texto")?.value||"";
  if(!texto.trim()) return;
  const btn=document.getElementById("cf-send");
  if(btn) btn.disabled=true;
  try{
    await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"novoComentario",categoria:cat,idTopico,nomeJogador:nome.trim()||"Anônimo",comentario:texto.trim()})});
    const ti=document.getElementById("cf-texto");if(ti) ti.value="";
    loadComentarios(idTopico,cat);
  }catch(e){toast("Erro ao enviar.");}finally{if(btn) btn.disabled=false;}
}

// ── Data loading ───────────────────────────────────────────────────────────
async function loadData(){
  // API
  Promise.all([
    fetch(`${API_URL}?action=conteudo&categoria=musicas`).then(r=>r.json()),
    fetch(`${API_URL}?action=conteudo&categoria=musicvideos`).then(r=>r.json()),
    fetch(`${API_URL}?action=conteudo&categoria=videos`).then(r=>r.json()),
  ]).then(([rm,rmv,rv])=>{
    DB.musicas=rm.data||[];
    DB.musicvideos=rmv.data||[];
    DB.videos=rv.data||[];
  }).catch(e=>console.warn("API:",e)).finally(()=>{
    loading=false;
    renderTab(activeTab);
  });

  // Charts CSV + Music Videos CSV
  try{
    const results=await Promise.all(CHARTS_CONFIG.map(async cfg=>{
      const rows=await fetchCSV(cfg.aba);
      const {entries,capa}=processChart(rows,cfg.isVideo,100);
      return entries.length?{nome:cfg.nome,sub:cfg.sub,icone:cfg.icone,isVideo:cfg.isVideo,capa,entries}:null;
    }));
    CHARTS=results.filter(Boolean);
    CHARTS.forEach(c=>{charts_data[c.nome]=c;});
    chartsError="";
  }catch(e){chartsError=String(e);}
  chartsLoading=false;

  try{
    MV_CSV=await fetchCSV("Music Videos");
  }catch(e){}

  renderTab(activeTab);
}

// ── Init ───────────────────────────────────────────────────────────────────
renderHome();
loadData();
</script>
