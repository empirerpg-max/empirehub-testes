name: Build & Deploy → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pelo GitHub UI

permissions:
  contents: write # precisa escrever na pasta docs/

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. Checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node 20
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala dependências
      - name: Install dependencies
        run: npm ci

      # 4. Build — injeta o Secret como variável de ambiente
      - name: Build Vite
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL }}
          VITE_SHEETS_API_KEY: ${{ secrets.VITE_SHEETS_API_KEY }}
        run: npm run build
        # O build gera a pasta /docs conforme vite.config.ts

      # 5. Commita a pasta /docs de volta na main
      # (GitHub Pages está configurado para servir /docs da branch main)
      - name: Commit docs/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "build: atualiza docs/ [skip ci]"
          git push
