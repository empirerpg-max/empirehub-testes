name: Build & Deploy → GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check (não fatal)
        run: npx tsc --noEmit || true

      - name: Build Vite
        env:
          VITE_GAS_URL: ${{ secrets.VITE_GAS_URL || '' }}
          VITE_SHEETS_API_KEY: ${{ secrets.VITE_SHEETS_API_KEY || '' }}
        run: npm run build

      - name: Commit docs/ to main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "build: atualiza docs/ [skip ci]"
          git push
